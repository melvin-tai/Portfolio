<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melvin Tai · Data Science Portfolio</title>
  <meta name="description" content="Melvin Tai, Computer Science (Data Science) undergraduate at Monash University Malaysia. Machine learning, analytics and consulting projects." />
  <meta property="og:title" content="Melvin Tai · Data Science Portfolio" />
  <meta property="og:description" content="Machine learning, analytics and consulting work by Melvin Tai." />
  <meta property="og:image" content="docs/pfp.jpg" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --paper: #ffffff;
      --raised: #ffffff;
      --tint: #f7f6fa;
      --ink: #17151d;
      --muted: #3d3a46;
      --faint: #67636f;
      --line: #e4e2e9;
      --accent: #5b2bd6;
      --accent-ink: #ffffff;
      --accent-soft: #ece6fc;
      --accent-mid: #b9a6f2;
      --ok: #1f7a4d;
      --radius: 10px;
      --wrap: 1180px;
      --gutter: clamp(16px, 4vw, 40px);
      color-scheme: light;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 84px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    h1, h2, h3, p, ul { margin: 0; }
    ul { padding: 0; list-style: none; }
    .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); }
    .num { font-variant-numeric: tabular-nums; }
    .skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 6px; z-index: 100; }
    .skip:focus { left: 8px; }

    /* ---------- Nav ---------- */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: saturate(1.4) blur(12px);
      -webkit-backdrop-filter: saturate(1.4) blur(12px);
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }
    .nav.is-stuck { border-bottom-color: var(--line); box-shadow: 0 1px 12px rgba(23, 21, 29, 0.04); }
    .nav-inner { display: flex; align-items: center; gap: 24px; height: 64px; }
    .brand { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; text-decoration: none; margin-right: auto; }
    .nav-links { display: flex; gap: 4px; }
    .nav-links a {
      text-decoration: none; font-size: 15px; font-weight: 500; color: var(--muted);
      padding: 6px 10px; border-radius: 6px; transition: color .15s, background .15s;
    }
    .nav-links a:hover { color: var(--ink); background: var(--accent-soft); }
    .nav-links a.is-active { color: var(--ink); }
    .nav-links a.is-active::after { content: ""; display: block; height: 2px; background: var(--accent); border-radius: 2px; margin-top: 2px; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      font: inherit; font-size: 15px; font-weight: 600; text-decoration: none;
      padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--ink);
      background: transparent; color: var(--ink); cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .btn:hover { background: var(--ink); color: var(--paper); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn.primary:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .btn.small { padding: 7px 14px; font-size: 14px; }
    .btn svg { width: 16px; height: 16px; flex: none; }

    /* ---------- Hero ---------- */
    .hero { display: grid; grid-template-columns: 1fr minmax(240px, 340px); gap: clamp(32px, 6vw, 88px); align-items: end; padding: clamp(48px, 9vw, 112px) 0 clamp(40px, 6vw, 72px); }
    .hero h1 {
      font-size: clamp(48px, 7.4vw, 100px); font-weight: 850; line-height: .92; letter-spacing: -0.045em;
      margin-left: -0.04em;
    }
    .hero-role { margin-top: 28px; font-size: clamp(19px, 2vw, 23px); font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; }
    .hero-role span { display: block; font-weight: 400; color: var(--muted); }
    .hero-summary { margin-top: 18px; max-width: 58ch; color: var(--muted); }
    .status {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 26px;
      font-size: 15px; font-weight: 600; padding: 7px 14px 7px 12px; border-radius: 999px;
      background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok);
    }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .social { display: flex; gap: 20px; margin-top: 22px; font-size: 15px; font-weight: 500; }
    .social a { color: var(--muted); text-underline-offset: 4px; text-decoration-color: var(--line); }
    .social a:hover { color: var(--ink); text-decoration-color: var(--accent); }
    .portrait { margin: 0; aspect-ratio: 4 / 5; border-radius: var(--radius); overflow: hidden; background: var(--tint); position: relative; box-shadow: 0 0 0 1px var(--line); }
    .portrait img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
    .portrait .initials { position: absolute; inset: 0; display: grid; place-items: center; font-size: 88px; font-weight: 850; color: var(--accent); letter-spacing: -0.05em; }

    /* ---------- Sections ---------- */
    .section { display: grid; grid-template-columns: 220px 1fr; gap: 24px clamp(24px, 4vw, 56px); padding: clamp(48px, 7vw, 88px) 0; border-top: 1px solid var(--line); }
    .section-head { position: sticky; top: 96px; align-self: start; }
    .section-head h2 { font-size: 26px; font-weight: 750; letter-spacing: -0.025em; line-height: 1.15; }
    .section-head p { margin-top: 8px; font-size: 15px; color: var(--faint); }
    .section-head a { display: inline-block; margin-top: 12px; font-size: 15px; font-weight: 600; color: var(--accent); text-underline-offset: 4px; }

    /* ---------- Timeline chart ---------- */
    .timeline { --label: 250px; position: relative; }
    .tl-axis, .tl-row { display: grid; grid-template-columns: var(--label) 1fr; align-items: center; }
    .tl-axis { height: 28px; font-size: 13px; color: var(--faint); }
    .tl-ticks { position: relative; height: 100%; }
    .tl-ticks span { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; }
    .tl-ticks span.year { color: var(--ink); font-weight: 600; }
    .tl-body { position: relative; }
    .tl-grid { position: absolute; top: 0; bottom: 0; left: var(--label); right: 0; pointer-events: none; }
    .tl-grid i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
    .tl-body { padding-bottom: 26px; }
    .tl-mark { position: absolute; top: -4px; bottom: 22px; width: 0; border-left: 2px solid var(--ink); }
    .tl-mark.grad { border-left: 2px dashed var(--accent); }
    .tl-mark b { position: absolute; top: calc(100% + 4px); left: 0; transform: translateX(-50%); font-size: 12px; font-weight: 700; padding: 0 4px; white-space: nowrap; }
    .tl-mark.grad b { color: var(--accent); }
    .tl-row { min-height: 46px; padding: 6px 0; }
    .tl-label { padding-right: 20px; line-height: 1.3; min-width: 0; }
    .tl-label strong, .tl-label span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tl-label strong { font-size: 15px; font-weight: 650; }
    .tl-label span { font-size: 13px; color: var(--faint); }
    .tl-track { position: relative; height: 22px; }
    .tl-bar {
      position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--accent);
      transform-origin: left center; animation: grow .7s cubic-bezier(.2,.7,.2,1) both;
      animation-delay: calc(var(--i) * 70ms + 150ms);
    }
    .tl-bar.lead { background: var(--accent-mid); }
    .tl-bar.future, .tl-legend i.future { background: repeating-linear-gradient(-45deg, var(--accent) 0 5px, #9d82ea 5px 9px); }
    .tl-bar.lead.future { background: repeating-linear-gradient(-45deg, var(--accent-mid) 0 5px, var(--accent-soft) 5px 9px); }
    .tl-bar.ongoing { border-radius: 4px 0 0 4px; }
    .tl-bar.ongoing::after { content: ""; position: absolute; left: 100%; top: 0; bottom: 0; width: 26px; background: linear-gradient(90deg, currentColor, transparent); color: inherit; opacity: .35; }
    .tl-bar.ongoing.work::after { background: linear-gradient(90deg, var(--accent), transparent); }
    .tl-bar.ongoing.lead::after { background: linear-gradient(90deg, var(--accent-mid), transparent); }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .tl-bar { animation: none; } }
    .tl-legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; font-size: 14px; color: var(--muted); }
    .tl-legend span { display: inline-flex; align-items: center; gap: 8px; }
    .tl-legend i { width: 18px; height: 10px; border-radius: 3px; background: var(--accent); }
    .tl-legend i.lead { background: var(--accent-mid); }
    .tl-legend i.grad { width: 0; height: 14px; border-left: 2px dashed var(--accent); border-radius: 0; background: none; }

    /* ---------- Entries (experience / leadership) ---------- */
    .entries { display: grid; gap: 40px; }
    .entry { display: grid; grid-template-columns: 150px 1fr; gap: 6px 28px; }
    .entry-date { font-size: 14px; color: var(--faint); padding-top: 4px; }
    .entry-date .badge { display: table; margin-top: 8px; }
    .badge.upcoming { color: var(--accent); border-color: var(--accent-mid); background: var(--accent-soft); }
    .entry-group { display: grid; gap: 28px; }
    .entry-group.multi .entry-main { border-left: 2px solid var(--line); padding-left: 20px; }
    .entry-group.multi .entry.sub .entry-main { padding-top: 0; }
    .entry h3 { font-size: 21px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; }
    .entry-org { margin-top: 2px; color: var(--muted); font-weight: 500; }
    .entry-org span { color: var(--faint); font-weight: 400; }
    .entry-body { margin-top: 12px; max-width: 70ch; color: var(--muted); }
    .highlights { display: grid; gap: 10px; }
    .highlights li { position: relative; padding-left: 20px; }
    .highlights li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 8px; height: 2px; background: var(--accent); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .tags li { font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); }

    /* ---------- Projects ---------- */
    .projects { display: grid; gap: 18px; }
    .project.has-media { display: grid; grid-template-columns: minmax(200px, 32%) 1fr; }
    .project.has-media .project-media { aspect-ratio: auto; min-height: 100%; border-bottom: 0; border-right: 1px solid var(--line); }
    .project { display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 2px rgba(23, 21, 29, 0.04); }
    .project.wip { background: var(--tint); border-style: dashed; border-color: #cfccd6; box-shadow: none; }
    .project-media { aspect-ratio: 16 / 9; background: var(--tint); border-bottom: 1px solid var(--line); overflow: hidden; }
    .project-media img { width: 100%; height: 100%; object-fit: cover; }
    .project-body { display: flex; flex-direction: column; flex: 1; padding: 22px 22px 20px; }
    .badge { align-self: flex-start; font-size: 12.5px; font-weight: 650; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
    .badge.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
    .project h3.flush { margin-top: 0; }
    .project h3 { margin-top: 12px; font-size: 20px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; }
    .project p { margin-top: 8px; color: var(--muted); font-size: 16px; }
    .project .tags { margin-top: 16px; }
    .project-link { margin-top: auto; padding-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 22px; }
    .project-meta { margin-top: 4px !important; font-size: 14px !important; color: var(--faint) !important; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
    .project-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
    .project .highlights { margin-top: 10px; color: var(--muted); font-size: 16px; }
    .text-link { font-weight: 600; font-size: 15px; color: var(--accent); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
    .text-link:hover { color: var(--ink); }
    .group-label { grid-column: 1 / -1; font-size: 15px; font-weight: 650; color: var(--muted); margin-top: 12px; }
    .group-label:first-child { margin-top: 0; }

    /* ---------- Writing ---------- */
    .writing { display: grid; }
    .writing article { display: grid; grid-template-columns: 1fr auto; gap: 2px 32px; padding: 22px 0; border-bottom: 1px solid var(--line); }
    .writing article:first-child { padding-top: 0; }
    .writing h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.35; }
    .writing .kind { font-size: 14px; color: var(--faint); margin-top: 2px; }
    .writing p.sum { grid-column: 1; color: var(--muted); max-width: 68ch; margin-top: 8px; }
    .writing .w-link { grid-column: 2; grid-row: 1 / span 3; align-self: start; white-space: nowrap; padding-top: 2px; }
    .writing .w-link em { font-style: normal; font-size: 14px; color: var(--faint); }

    /* ---------- Skills ---------- */
    .skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
    .skills h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
    .skills li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 16px; }

    /* ---------- Contact ---------- */
    .contact { padding: clamp(64px, 9vw, 120px) 0 clamp(48px, 6vw, 80px); border-top: 1px solid var(--line); }
    .contact h2 { font-size: clamp(36px, 6vw, 72px); font-weight: 850; letter-spacing: -0.04em; line-height: 1; }
    .contact p { margin-top: 18px; max-width: 54ch; color: var(--muted); font-size: 18px; }
    .contact .mail { display: inline-block; margin-top: 26px; font-size: clamp(20px, 3vw, 30px); font-weight: 650; letter-spacing: -0.02em; color: var(--accent); text-underline-offset: 8px; text-decoration-thickness: 2px; word-break: break-all; }
    .contact .mail:hover { color: var(--ink); }
    .contact .actions { margin-top: 28px; }
    footer { padding: 28px 0 40px; font-size: 14px; color: var(--faint); }
    footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
    footer a { color: var(--faint); }

    .loading { min-height: 70vh; }
    .sync-note { font-size: 13px; color: var(--faint); }

    /* ---------- Responsive ---------- */
    @media (max-width: 960px) {
      .section { grid-template-columns: 1fr; }
      .section-head { position: static; }
      .timeline { --label: 170px; }
    }
    @media (max-width: 820px) {
      .nav-links { display: none; }
      .hero { grid-template-columns: 1fr; align-items: start; }
      .portrait { order: -1; width: 132px; aspect-ratio: 1; border-radius: 50%; }
      .portrait .initials { font-size: 44px; }
      .project.has-media { display: flex; }
      .project.has-media .project-media { aspect-ratio: 16 / 9; min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .skills { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      body { font-size: 16px; }
      .entry { grid-template-columns: 1fr; }
      .entry-date { padding-top: 0; order: -1; }
      .timeline { --label: 0px; }
      .tl-row { grid-template-columns: 1fr; padding: 8px 0 10px; }
      .tl-label { padding: 0 0 6px; }
      .tl-label strong, .tl-label span { white-space: normal; }
      .tl-axis { grid-template-columns: 1fr; }
      .tl-axis > div:first-child { display: none; }
      .tl-ticks span:not(.year) { display: none; }
      .writing article { grid-template-columns: 1fr; }
      .writing .w-link { grid-column: 1; grid-row: auto; margin-top: 10px; order: 3; }
      .writing p.sum { order: 2; }
      .tl-label { position: relative; z-index: 2; }
      .tl-label strong, .tl-label span { background: var(--paper); }
      .tl-mark b { background: var(--paper); }
      .skills { grid-template-columns: 1fr; }
      .nav .btn { padding: 6px 12px; }
    }
  </style>
</head>
<body>

  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="#top" id="brand">Melvin Tai</a>
      <nav class="nav-links" aria-label="Sections">
        <a href="#timeline">Timeline</a>
        <a href="#experience">Experience</a>
        <a href="#leadership">Leadership</a>
        <a href="#projects">Projects</a>
        <a href="#writing">Writing</a>
        <a href="#skills">Skills</a>
      </nav>
      <a class="btn small" id="nav-resume" href="#contact">Resume</a>
    </div>
  </header>

  <main id="main" class="wrap loading" aria-busy="true"></main>

  <noscript>
    <div class="wrap" style="padding:48px 0">
      <h1>Melvin Tai</h1>
      <p>Computer Science (Data Science) undergraduate at Monash University Malaysia.
        This page needs JavaScript. You can also see my
        <a href="https://www.linkedin.com/in/melvin-tai/">LinkedIn</a>,
        <a href="https://github.com/melvin-tai">GitHub</a> or
        <a href="mailto:melvintaich.126@gmail.com">email me</a>.</p>
    </div>
  </noscript>

  <footer>
    <div class="wrap">
      <span id="copyright"></span>
      <span id="sync-note" class="sync-note"></span>
    </div>
  </footer>

  <script src="content.js"></script>
  <script>
  (function () {
    "use strict";

    /* ---------- Small helpers ---------- */
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    // Only allow http(s), mailto and relative paths in links/images.
    const safeUrl = (u) => {
      u = String(u ?? "").trim();
      if (!u) return "";
      if (/^(https?:|mailto:)/i.test(u)) return u;
      if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return ""; // any other scheme (javascript:, data:, ...)
      return u;
    };
    const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
    const NOW = new Date();
    const isPresent = (s) => /^(present|now|current|ongoing)$/i.test(String(s || "").trim());
    function parseMonth(s) {
      s = String(s || "").trim();
      if (!s) return null;
      if (isPresent(s)) return new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
      const m = s.match(/^([a-z]{3})[a-z.]*\s+(\d{4})$/i);
      if (m) { const i = MONTHS.indexOf(m[1].toLowerCase()); if (i >= 0) return new Date(+m[2], i, 1); }
      const iso = s.match(/^(\d{4})-(\d{1,2})/);
      if (iso) return new Date(+iso[1], +iso[2] - 1, 1);
      return null;
    }
    const fmtMonth = (d) => d.toLocaleString("en-GB", { month: "short" }) + " " + d.getFullYear();
    function range(item) {
      if (!item.start && !item.end) return "";
      const a = item.start ? esc(item.start) : "";
      const b = item.end ? esc(isPresent(item.end) ? "Present" : item.end) : "";
      return a && b ? `${a} – ${b}` : a || b;
    }
    const list = (v) => Array.isArray(v) ? v.filter(Boolean) : String(v || "").split(",").map((s) => s.trim()).filter(Boolean);
    const lines = (v) => Array.isArray(v) ? v.filter(Boolean) : String(v || "").split(/\r?\n/).map((s) => s.replace(/^[-•*]\s*/, "").trim()).filter(Boolean);
    const resumeUrl = (p) => safeUrl(p.resume || p.resumeView || p.resumeDownload);
    const isUpcoming = (x) => { const d = parseMonth(x.start); return !!d && !isPresent(x.start) && d > NOW; };
    const tagList = (tags) => { const t = list(tags); return t.length ? `<ul class="tags">${t.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""; };

    /* ---------- Google Sheet (published CSV) support ---------- */
    function parseCSV(text) {
      const rows = []; let row = [], field = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
          else field += c;
        } else if (c === '"') q = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(field); rows.push(row); row = []; field = "";
        } else field += c;
      }
      if (field !== "" || row.length) { row.push(field); rows.push(row); }
      return rows.filter((r) => r.some((x) => x.trim() !== ""));
    }
    const camel = (k) => String(k).trim().replace(/[\s_-]+([a-z0-9])/gi, (_, c) => c.toUpperCase()).replace(/^./, (c) => c.toLowerCase());
    const SECTIONS = ["experience", "leadership", "projects", "writing", "skills"];

    function mergeSheet(base, csvText) {
      const rows = parseCSV(csvText);
      if (rows.length < 2) throw new Error("Sheet is empty");
      const head = rows[0].map((h) => camel(h));
      if (!head.includes("section")) throw new Error("Sheet has no 'section' column");
      const data = JSON.parse(JSON.stringify(base));
      const fresh = {};
      for (const r of rows.slice(1)) {
        const o = {}; head.forEach((h, i) => (o[h] = (r[i] ?? "").trim()));
        const sec = camel(o.section || "");
        if (sec === "profile") { if (o.title) data.profile[camel(o.title)] = o.summary; continue; }
        if (!SECTIONS.includes(sec)) continue;
        (fresh[sec] = fresh[sec] || []).push({
          title: o.title, organization: o.organization, location: o.location,
          start: o.start, end: o.end, status: o.status, summary: o.summary,
          highlights: lines(o.highlights), tags: list(o.tags),
          link: o.link, linkLabel: o.linkLabel, image: o.image,
          category: o.category, demo: o.demo, demoLabel: o.demoLabel
        });
      }
      for (const s of Object.keys(fresh)) data[s] = fresh[s];
      return data;
    }

    async function loadData() {
      const base = window.PORTFOLIO;
      const url = (window.PORTFOLIO_SHEET_CSV_URL || "").trim();
      if (!url) return { data: base, source: "file" };
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4000);
      try {
        const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return { data: mergeSheet(base, await res.text()), source: "sheet" };
      } catch (err) {
        console.warn("[portfolio] Google Sheet not loaded, using content.js instead:", err.message);
        return { data: base, source: "fallback" };
      } finally { clearTimeout(timer); }
    }

    /* ---------- Renderers ---------- */
    function hero(p) {
      const initials = esc((p.name || "").split(/\s+/).map((w) => w[0]).join("").slice(0, 2));
      const photo = safeUrl(p.photo);
      const sub = [p.university, p.graduation ? `graduating ${p.graduation}` : ""].filter(Boolean).map(esc).join(", ");
      return `
      <section class="hero" id="top">
        <div>
          <h1>${esc(p.name)}</h1>
          <p class="hero-role">${esc(p.headline)}${sub ? `<span>${sub}</span>` : ""}</p>
          ${p.summary ? `<p class="hero-summary">${esc(p.summary)}</p>` : ""}
          ${p.availability ? `<p class="status">${esc(p.availability)}</p>` : ""}
          <div class="actions">
            ${p.email ? `<a class="btn primary" href="mailto:${esc(p.email)}?subject=${encodeURIComponent("Hello from your portfolio")}">Email me</a>` : ""}
            ${resumeUrl(p) ? `<a class="btn" href="${esc(resumeUrl(p))}" target="_blank" rel="noopener">View resume</a>` : ""}
          </div>
          <ul class="social">
            ${p.linkedin ? `<li><a href="${esc(safeUrl(p.linkedin))}" target="_blank" rel="noopener">LinkedIn</a></li>` : ""}
            ${p.github ? `<li><a href="${esc(safeUrl(p.github))}" target="_blank" rel="noopener">GitHub</a></li>` : ""}
          </ul>
        </div>
        <figure class="portrait">
          <span class="initials" aria-hidden="true">${initials}</span>
          ${photo ? `<img src="${esc(photo)}" alt="Portrait of ${esc(p.name)}" onerror="this.remove()" />` : ""}
        </figure>
      </section>`;
    }

    function timeline(data) {
      const items = [
        ...(data.experience || []).map((x) => ({ ...x, kind: "work" })),
        ...(data.leadership || []).map((x) => ({ ...x, kind: "lead" }))
      ].map((x) => ({ ...x, s: parseMonth(x.start), e: parseMonth(x.end) }))
       .filter((x) => x.s && x.e && x.e >= x.s);
      if (!items.length) return "";
      // Month-end for finished roles so "Nov 2025 – Feb 2026" covers all of February.
      items.forEach((x) => { if (!isPresent(x.end)) x.e = new Date(x.e.getFullYear(), x.e.getMonth() + 1, 1); });
      items.sort((a, b) => a.s - b.s || a.e - b.e);

      const grad = parseMonth(data.profile.graduation);
      let min = new Date(Math.min(...items.map((x) => x.s)));
      let maxT = Math.max(...items.map((x) => x.e), NOW.getTime(), grad ? grad.getTime() : 0);
      min = new Date(min.getFullYear(), min.getMonth() - 1, 1);
      const maxD = new Date(maxT); const max = new Date(maxD.getFullYear(), maxD.getMonth() + 2, 1);
      const span = max - min;
      const pct = (d) => ((d - min) / span) * 100;

      const ticks = [];
      for (let d = new Date(min.getFullYear(), min.getMonth() + 1, 1); d < max; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
        if (d.getMonth() % 3 === 0) ticks.push(d);
      }
      const tickHtml = ticks.map((d) => d.getMonth() === 0
        ? `<span class="year num" style="left:${pct(d)}%">${d.getFullYear()}</span>`
        : `<span class="num" style="left:${pct(d)}%">${d.toLocaleString("en-GB", { month: "short" })}</span>`).join("");
      const grid = ticks.map((d) => `<i style="left:${pct(d)}%"></i>`).join("");

      const rows = items.map((x, i) => {
        const left = pct(x.s), width = Math.max(pct(x.e) - left, 0.8);
        const ongoing = isPresent(x.end), future = x.s > NOW;
        const tip = `${x.title} · ${x.organization} · ${x.start} – ${ongoing ? "Present" : x.end}`;
        return `<div class="tl-row">
          <div class="tl-label" title="${esc(x.organization + " — " + x.title)}"><strong>${esc(x.organization)}</strong><span>${esc(x.title)}</span></div>
          <div class="tl-track"><div class="tl-bar ${x.kind}${ongoing ? " ongoing" : ""}${future ? " future" : ""}" style="left:${left}%;width:${width}%;--i:${i}" title="${esc(tip)}" role="img" aria-label="${esc(tip)}"></div></div>
        </div>`;
      }).join("");

      const marks = `<div class="tl-mark num" style="left:${pct(NOW)}%"><b>Today</b></div>`
        + (grad ? `<div class="tl-mark grad" style="left:${pct(grad)}%"><b>Graduation</b></div>` : "");

      return `
      <section class="section" id="timeline">
        <div class="section-head"><h2>Timeline</h2><p>Roles at a glance, ${esc(fmtMonth(min))} to ${esc(fmtMonth(new Date(max.getFullYear(), max.getMonth() - 1, 1)))}.</p></div>
        <div class="timeline">
          <div class="tl-axis"><div></div><div class="tl-ticks">${tickHtml}</div></div>
          <div class="tl-body">
            <div class="tl-grid">${grid}${marks}</div>
            ${rows}
          </div>
          <div class="tl-legend">
            <span><i></i>Professional</span>
            <span><i class="lead"></i>Leadership &amp; Service</span>
            ${items.some((x) => x.s > NOW) ? `<span><i class="future"></i>Upcoming</span>` : ""}
            ${grad ? `<span><i class="grad"></i>Expected graduation</span>` : ""}
          </div>
        </div>
      </section>`;
    }

    function entries(id, title, sub, items, extra = "") {
      if (!items || !items.length) return "";
      // Adjacent roles at the same organisation are shown as one group (e.g. a promotion).
      const groups = [];
      items.forEach((x) => {
        const g = groups[groups.length - 1];
        if (g && x.organization && g[0].organization === x.organization) g.push(x); else groups.push([x]);
      });
      const role = (x, first) => {
        const hl = lines(x.highlights);
        const hasBody = x.summary || hl.length;
        return `<article class="entry${first ? "" : " sub"}">
          <p class="entry-date num">${range(x)}${isUpcoming(x) ? `<span class="badge upcoming">Upcoming</span>` : ""}</p>
          <div class="entry-main">
            <h3>${esc(x.title)}</h3>
            ${first ? `<p class="entry-org">${esc(x.organization)}${x.location ? ` <span>${esc(x.location)}</span>` : ""}</p>` : ""}
            ${hasBody ? `<div class="entry-body">
              ${x.summary ? `<p>${esc(x.summary)}</p>` : ""}
              ${hl.length ? `<ul class="highlights"${x.summary ? ' style="margin-top:10px"' : ""}>${hl.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
            </div>` : ""}
            ${tagList(x.tags)}
          </div>
        </article>`;
      };
      const body = groups.map((g) => `<div class="entry-group${g.length > 1 ? " multi" : ""}">${g.map((x, i) => role(x, i === 0)).join("")}</div>`).join("");
      return `<section class="section" id="${id}">
        <div class="section-head"><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}${extra}</div>
        <div class="entries">${body}</div>
      </section>`;
    }

    function projects(items, p) {
      if (!items || !items.length) return "";
      // A project is in progress if its end date is "Present" (or its status says so).
      const isDone = (x) => x.status ? /complete|done|shipped|live/i.test(x.status) : !isPresent(x.end);
      const card = (x) => {
        const img = safeUrl(x.image), link = safeUrl(x.link), demo = safeUrl(x.demo);
        const done = isDone(x), hl = lines(x.highlights), when = range(x);
        const meta = [x.category ? esc(x.category) : "", when ? `<span class="num">${when}</span>` : ""].filter(Boolean);
        return `<article class="project${done ? "" : " wip"}${img ? " has-media" : ""}">
          ${img ? `<div class="project-media"><img src="${esc(img)}" alt="" loading="lazy" onerror="var c=this.closest('.project');this.parentNode.remove();if(c)c.classList.remove('has-media')" /></div>` : ""}
          <div class="project-body">
            ${x.status && !grouped ? `<span class="badge${done ? " done" : ""}">${esc(x.status)}</span>` : ""}
            <h3 class="${x.status && !grouped ? "" : "flush"}">${esc(x.title)}</h3>
            ${meta.length ? `<p class="project-meta">${meta.join('<span class="sep" aria-hidden="true"></span>')}</p>` : ""}
            ${x.summary ? `<p>${esc(x.summary)}</p>` : ""}
            ${hl.length ? `<ul class="highlights">${hl.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
            ${tagList(x.tags)}
            ${link || demo ? `<div class="project-link">
              ${link ? `<a class="text-link" href="${esc(link)}" target="_blank" rel="noopener">${esc(x.linkLabel || "Repository")}</a>` : ""}
              ${demo ? `<a class="text-link" href="${esc(demo)}" target="_blank" rel="noopener">${esc(x.demoLabel || "Live demo")}</a>` : ""}
            </div>` : ""}
          </div>
        </article>`;
      };
      const done = items.filter(isDone), wip = items.filter((x) => !isDone(x));
      const grouped = done.length > 0 && wip.length > 0;
      const groups = grouped
        ? `<p class="group-label">Currently building</p>${wip.map(card).join("")}<p class="group-label">Completed</p>${done.map(card).join("")}`
        : items.map(card).join("");
      const gh = safeUrl(p.github);
      return `<section class="section" id="projects">
        <div class="section-head"><h2>Projects</h2><p>${done.length} completed, ${wip.length} in progress.</p>${gh ? `<a href="${esc(gh)}" target="_blank" rel="noopener">All code on GitHub</a>` : ""}</div>
        <div class="projects">${groups}</div>
      </section>`;
    }

    function writing(items) {
      if (!items || !items.length) return "";
      return `<section class="section" id="writing">
        <div class="section-head"><h2>Writing &amp; Research</h2><p>Papers and academic proposals.</p></div>
        <div class="writing">${items.map((x) => {
          const link = safeUrl(x.link);
          return `<article>
            <h3>${esc(x.title)}</h3>
            <div class="w-link">${link ? `<a class="text-link" href="${esc(link)}" target="_blank" rel="noopener">${esc(x.linkLabel || "Read")}</a>` : `<em>Available on request</em>`}</div>
            ${x.status ? `<p class="kind">${esc(x.status)}</p>` : ""}
            ${x.summary ? `<p class="sum">${esc(x.summary)}</p>` : ""}
          </article>`; }).join("")}
        </div>
      </section>`;
    }

    function skills(groups) {
      if (!groups || !groups.length) return "";
      const cols = groups.map((g) => `<div><h3>${esc(g.title)}</h3><ul>${list(g.tags).map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>`).join("");
      return `<section class="section" id="skills">
        <div class="section-head"><h2>Skills</h2></div>
        <div class="skills">${cols}</div>
      </section>`;
    }

    function contact(p) {
      return `<section class="contact" id="contact">
        <h2>Let’s work together.</h2>
        ${p.availability ? `<p>${esc(p.availability)}. Let's connect via email!</p>` : `<p>Let's connect via email!</p>`}
        ${p.email ? `<a class="mail" href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ""}
        <div class="actions">
          ${resumeUrl(p) ? `<a class="btn primary" href="${esc(resumeUrl(p))}" target="_blank" rel="noopener">View resume</a>` : ""}
          ${p.linkedin ? `<a class="btn" href="${esc(safeUrl(p.linkedin))}" target="_blank" rel="noopener">LinkedIn</a>` : ""}
          ${p.github ? `<a class="btn" href="${esc(safeUrl(p.github))}" target="_blank" rel="noopener">GitHub</a>` : ""}
        </div>
      </section>`;
    }

    function render(data, source) {
      const p = data.profile || {};
      const resumeHref = resumeUrl(p) || "#contact";
      const main = document.getElementById("main");
      main.innerHTML =
        hero(p) +
        timeline(data) +
        entries("experience", "Experience", "", data.experience) +
        entries("leadership", "Leadership &amp; service", "Student organisations and teams.", data.leadership) +
        projects(data.projects, p) +
        writing(data.writing) +
        skills(data.skills) +
        contact(p);
      main.classList.remove("loading");
      main.removeAttribute("aria-busy");

      document.getElementById("brand").textContent = p.name || "Portfolio";
      const nr = document.getElementById("nav-resume");
      nr.href = resumeHref; if (resumeHref.startsWith("http")) { nr.target = "_blank"; nr.rel = "noopener"; }
      document.getElementById("copyright").textContent = `© ${NOW.getFullYear()} ${p.name || ""}`;
      if (source === "sheet") document.getElementById("sync-note").textContent = "Content synced from Google Sheets";

      // Hide nav links whose section isn't on the page.
      document.querySelectorAll(".nav-links a").forEach((a) => { if (!document.querySelector(a.getAttribute("href"))) a.remove(); });
      watchSections();
      if (location.hash) { const t = document.querySelector(CSS.escape ? "#" + CSS.escape(location.hash.slice(1)) : location.hash); t?.scrollIntoView(); }
    }

    function watchSections() {
      const links = [...document.querySelectorAll(".nav-links a")];
      const map = new Map(links.map((a) => [a.getAttribute("href").slice(1), a]));
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { links.forEach((l) => l.classList.remove("is-active")); map.get(e.target.id)?.classList.add("is-active"); }
        });
      }, { rootMargin: "-45% 0px -50% 0px" });
      map.forEach((_, id) => { const el = document.getElementById(id); if (el) io.observe(el); });
    }

    const nav = document.getElementById("nav");
    addEventListener("scroll", () => nav.classList.toggle("is-stuck", scrollY > 8), { passive: true });

    if (!window.PORTFOLIO) {
      document.getElementById("main").innerHTML = '<p style="padding:64px 0">content.js didn’t load. Check that it sits next to index.html.</p>';
      return;
    }
    loadData().then(({ data, source }) => render(data, source));
  })();
  </script>
</body>
</html>
