<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melvin Tai · Portfolio</title>
  <meta name="description" content="Melvin Tai, Computer Science (Data Science) undergraduate at Monash University Malaysia." />
  <meta property="og:title" content="Melvin Tai · Portfolio" />
  <meta property="og:description" content="Portfolio of Melvin Tai." />
  <meta property="og:image" content="docs/pfp.jpg" />
  <meta name="theme-color" content="#f7f6fb" />
  <link rel="icon" type="image/png" href="docs/browser.png" />
  <link rel="apple-touch-icon" href="docs/browser.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f7f6fb;
      --surface: #ffffff;
      --ink: #18151f;
      --muted: #433e4f;
      --faint: #676174;
      --line: #e1deea;
      --line-strong: #c5bfd3;
      --accent: #5b2bd6;
      --accent-deep: #4519b3;
      --accent-soft: #ede7fd;
      --accent-mid: #c6b5f5;
      --accent-ink: #ffffff;
      --lead: #a88bf0;
      --lead-deep: #7650dc;
      --lead-mid: #d3c5fa;
      --ok: #157f4a;
      --box: #6d3cf0;
      --sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --wrap: 1200px;
      --gutter: clamp(16px, 4vw, 48px);
      color-scheme: light;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 80px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--sans); font-size: 17px; line-height: 1.65;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    h1, h2, h3, p, ul, figure { margin: 0; }
    ul { padding: 0; list-style: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
    .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); }
    .num { font-variant-numeric: tabular-nums; }
    .skip { position: absolute; left: -999px; top: 8px; z-index: 100; padding: 8px 14px; border-radius: 6px; background: var(--ink); color: var(--bg); font-family: var(--sans); }
    .skip:focus { left: 8px; }

    /* ---------- Nav ---------- */
    .nav { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
    .nav.is-stuck { border-bottom-color: var(--line); }
    .nav-inner { display: flex; align-items: center; gap: 20px; height: 64px; font-family: var(--sans); }
    .brand { margin-right: auto; font-size: 18px; font-weight: 750; letter-spacing: -0.02em; text-decoration: none; }
    .nav-links { display: flex; gap: 2px; }
    .nav-links a { position: relative; padding: 6px 11px; font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: none; border-radius: 6px; }
    .nav-links a:hover { color: var(--ink); background: var(--accent-soft); }
    .nav-links a.is-active { color: var(--ink); }
    .nav-links a.is-active::after { content: ""; position: absolute; left: 11px; right: 11px; bottom: 1px; height: 2px; border-radius: 2px; background: var(--accent); }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; font: 600 15px/1.2 var(--sans); text-decoration: none; color: var(--ink); background: transparent; border: 1.5px solid var(--line-strong); border-radius: 8px; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .btn:hover { border-color: var(--ink); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn.primary:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .btn.small { padding: 7px 14px; font-size: 14px; }

    /* ---------- Hero ---------- */
    /* Hero is sized by viewport height as well as width so the whole thing fits on one screen */
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(32px, 6vw, 96px); align-items: center; padding: clamp(20px, 5vh, 72px) 0 clamp(24px, 5vh, 56px); }
    /* Name is indented, with a thin vertical rule in the indent to mark it as deliberate */
    .hero h1 { position: relative; padding-left: clamp(22px, 3.4vw, 48px); font-family: var(--sans); font-size: clamp(44px, min(9.5vw, 14vh), 132px); font-weight: 800; line-height: .92; letter-spacing: -0.045em; overflow-wrap: anywhere; }
    .hero h1::before { content: ""; position: absolute; left: 0; top: .1em; bottom: .02em; width: 6px; border-radius: 2px; background: #000; }
    .hero h1 span { display: block; }
    .role { margin-top: clamp(14px, 3.5vh, 32px); font-family: var(--sans); font-size: clamp(20px, 2.1vw, 24px); font-weight: 600; line-height: 1.3; letter-spacing: -0.015em; }
    .school { margin-top: 4px; font-family: var(--sans); font-size: 17px; color: var(--faint); }
    .summary { margin-top: clamp(10px, 2.4vh, 20px); max-width: 58ch; font-size: 17.5px; color: var(--muted); }
    .status { display: inline-flex; align-items: center; gap: 10px; margin-top: clamp(12px, 2.8vh, 24px); font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--ok); }
    .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: clamp(12px, 2.8vh, 24px); }
    .social { display: flex; gap: 18px; margin-left: 10px; font-family: var(--sans); font-size: 15px; font-weight: 500; }
    .social a { color: var(--muted); text-underline-offset: 4px; text-decoration-color: var(--line-strong); }
    .social a:hover { color: var(--ink); text-decoration-color: var(--accent); }

    /* Portrait framed as detection output */
    .subject { position: relative; width: clamp(240px, min(34vw, 66vh), 440px); }
    .frame { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 4px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
    .frame img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
    .frame .initials { position: absolute; inset: 0; display: grid; place-items: center; font: 800 96px/1 var(--sans); letter-spacing: -0.05em; color: var(--accent); }
    .det { position: absolute; z-index: 2; border: 2px solid var(--box); pointer-events: none; }
    .det b { position: absolute; left: -2px; bottom: 100%; padding: 1px 7px 2px; font: 600 12.5px/1.4 var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--accent-ink); background: var(--box); border-radius: 3px 3px 0 0; }
    .det.person { left: 19%; top: 21%; right: 20%; bottom: 3%; }
    .det.screen { left: 77%; top: 5%; right: 1.5%; bottom: 52%; opacity: .75; border-width: 1.5px; }
    .no-photo .det, .no-photo .scan { display: none; }
    .scan { display: none; }
    .caption { margin-top: 12px; font-family: var(--sans); font-size: 13.5px; color: var(--faint); }

    /* ---------- Draft animations ----------
       Everything below only runs when JS adds .anim to <html>, which it skips under prefers-reduced-motion.
       1. Hero: the rule draws down, then the name wipes out from it.
       2. Portrait: a detector scan sweeps the photo; each box locks as the scan passes it and its score counts up.
          Hovering (or tapping) the photo re-runs the detector.
       3. Timeline: bars draw left to right the first time the chart scrolls into view.
       4. Expandable rows open and close smoothly (browsers that support interpolate-size). */
    .anim .hero h1::before { transform-origin: top; animation: rule .5s cubic-bezier(.6,0,.2,1) .05s both; }
    .anim .hero h1 span { animation: wipe .75s cubic-bezier(.2,.8,.2,1) both; }
    .anim .hero h1 span:nth-child(1) { animation-delay: .35s; }
    .anim .hero h1 span:nth-child(2) { animation-delay: .47s; }
    .anim .hero h1 span:nth-child(3) { animation-delay: .59s; }
    @keyframes rule { from { transform: scaleY(0); } }
    @keyframes wipe {
      from { clip-path: inset(-.2em 100% -.25em 0); transform: translateX(-.18em); }
      to { clip-path: inset(-.2em -.2em -.25em 0); transform: none; }
    }

    .anim .scan { display: block; position: absolute; z-index: 3; left: 0; right: 0; top: -24%; height: 24%; pointer-events: none; opacity: 0;
      background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--box) 16%, transparent) 88%, var(--box) 88% 90%, transparent 90%); }
    .anim .run .scan { animation: scan 1.15s cubic-bezier(.45,.05,.55,.95) .2s both; }
    @keyframes scan { 0% { top: -24%; opacity: 1; } 85% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    .anim .det, .anim .det b { opacity: 0; }
    .anim .run .det { animation: lock .55s cubic-bezier(.2,.8,.2,1) both; }
    .anim .run .det b { animation: tag .25s ease-out both; }
    /* Delays follow the scan line: the screen sits higher in the frame, so it is detected first */
    .anim .run .det.screen { animation-delay: .62s; }
    .anim .run .det.screen b { animation-delay: .95s; }
    .anim .run .det.person { animation-delay: 1.05s; }
    .anim .run .det.person b { animation-delay: 1.35s; }
    .anim .run .det.screen { --to: .75; }
    @keyframes lock { from { opacity: 0; transform: scale(1.1); } to { opacity: var(--to, 1); transform: scale(1); } }
    @keyframes tag { from { opacity: 0; } to { opacity: 1; } }
    .anim .subject { cursor: crosshair; }

    .anim .timeline .tl-bar { transform: scaleX(0); transform-origin: left; transition: transform .9s cubic-bezier(.2,.8,.2,1) calc(var(--i, 0) * 70ms); }
    .anim .timeline.in .tl-bar { transform: none; }
    .anim .timeline .tl-mark { clip-path: inset(-10px -120px 100% -120px); transition: clip-path .6s cubic-bezier(.6,0,.2,1) .5s; }
    .anim .timeline.in .tl-mark { clip-path: inset(-10px -120px -40px -120px); }

    @supports (interpolate-size: allow-keywords) {
      .anim { interpolate-size: allow-keywords; }
      .anim .row::details-content { height: 0; overflow: clip; transition: height .35s cubic-bezier(.2,.8,.2,1), content-visibility .35s allow-discrete; }
      .anim .row[open]::details-content { height: auto; }
    }
    @media print { .anim .timeline .tl-bar { transform: none; } .anim .timeline .tl-mark { clip-path: none; } }

    /* ---------- Credentials ---------- */
    .creds { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 0; border-top: 2px solid var(--ink); font-family: var(--sans); }
    .creds li > a, .creds li > div { display: block; height: 100%; padding: 18px 24px 22px; border-left: 1px solid var(--line); text-decoration: none; }
    .creds li:first-child > a, .creds li:first-child > div { border-left: 0; padding-left: 0; }
    .creds .k { display: block; font-size: 14px; font-weight: 600; color: var(--accent); }
    .creds strong { display: block; margin-top: 4px; font-size: 20px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; }
    .creds .d { display: block; margin-top: 4px; font-size: 14.5px; line-height: 1.4; color: var(--faint); }
    .creds a:hover strong { color: var(--accent); }

    /* ---------- Sections ---------- */
    .sec { padding: clamp(56px, 8vw, 104px) 0 0; }
    .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; padding-bottom: 16px; margin-bottom: clamp(24px, 3vw, 36px); border-bottom: 1px solid var(--line-strong); font-family: var(--sans); }
    .sec-head h2 { font-size: clamp(30px, 4vw, 44px); font-weight: 750; letter-spacing: -0.03em; line-height: 1.1; }
    .sec-head p { font-size: 15.5px; color: var(--faint); }
    .sec-head a { color: var(--accent); font-weight: 600; text-underline-offset: 4px; }
    .group-label { margin: 40px 0 14px; font-family: var(--sans); font-size: 17px; font-weight: 650; color: var(--muted); }
    .group-label:first-child { margin-top: 0; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; font-family: var(--sans); }
    .tags li { padding: 3px 10px; font-size: 13.5px; font-weight: 600; color: var(--accent-deep); background: var(--accent-soft); border: 1px solid var(--accent-mid); border-radius: 6px; }
    .bullets { display: grid; gap: 8px; }
    .bullets li { position: relative; padding-left: 22px; }
    .bullets li::before { content: ""; position: absolute; left: 3px; top: .78em; width: 10px; height: 1.5px; background: var(--accent); }
    .text-link { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--accent); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
    .text-link:hover { color: var(--ink); }
    .links { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 16px; }
    .flag { display: inline-block; margin-left: 10px; padding: 1px 9px; font: 650 12px/1.6 var(--sans); vertical-align: 3px; letter-spacing: 0; color: var(--accent-ink); background: var(--accent); border-radius: 999px; white-space: nowrap; }
    .flag.lead { background: var(--lead-deep); }

    /* ---------- Timeline ---------- */
    .timeline { --label: 260px; font-family: var(--sans); }
    .tl-axis, .tl-row { display: grid; grid-template-columns: var(--label) 1fr; align-items: center; }
    .tl-axis { height: 28px; font-size: 13px; color: var(--faint); }
    .tl-ticks { position: relative; height: 100%; }
    .tl-ticks span { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; }
    .tl-ticks span.year { color: var(--ink); font-weight: 650; }
    .tl-body { position: relative; padding-bottom: 28px; }
    .tl-grid { position: absolute; top: 0; bottom: 0; left: var(--label); right: 0; pointer-events: none; }
    .tl-grid i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
    .tl-mark { position: absolute; top: -4px; bottom: 24px; width: 0; border-left: 1.5px solid var(--ink); }
    .tl-mark.grad { border-left: 1.5px dashed var(--accent); }
    .tl-mark b { position: absolute; top: calc(100% + 4px); left: 0; transform: translateX(-50%); padding: 0 4px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--bg); }
    .tl-mark.grad b { color: var(--accent); }
    .tl-row { min-height: 48px; padding: 6px 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
    .tl-row:first-child { border-top: 0; }
    .tl-label { min-width: 0; padding-right: 20px; line-height: 1.3; }
    .tl-label strong, .tl-label span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tl-label strong { font-size: 15px; font-weight: 650; }
    .tl-label span { font-size: 13px; color: var(--faint); }
    .tl-track { position: relative; height: 14px; }
    .tl-bar { position: absolute; top: 0; bottom: 0; border-radius: 7px; background: var(--accent); }
    .tl-bar.lead { background: var(--lead); }
    .tl-bar.future { background: repeating-linear-gradient(-45deg, var(--accent) 0 4px, color-mix(in srgb, var(--accent) 45%, var(--bg)) 4px 8px); }
    .tl-bar.lead.future { background: repeating-linear-gradient(-45deg, var(--lead) 0 4px, color-mix(in srgb, var(--lead) 45%, var(--bg)) 4px 8px); }
    .tl-bar.ongoing { border-radius: 7px 0 0 7px; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
    .tl-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; font-size: 14px; color: var(--muted); }
    .tl-legend span { display: inline-flex; align-items: center; gap: 8px; }
    .tl-legend i { width: 18px; height: 8px; border-radius: 4px; background: var(--accent); }
    .tl-legend i.lead { background: var(--lead); }
    .tl-legend i.future { background: repeating-linear-gradient(-45deg, var(--muted) 0 3px, transparent 3px 6px); }
    .tl-legend i.grad { width: 0; height: 14px; border-left: 1.5px dashed var(--accent); border-radius: 0; background: none; }

    /* ---------- Experience / leadership ---------- */
    .roles { display: grid; }
    .org { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 10px 64px; padding: 32px 0; border-top: 1px solid var(--line); }
    .org:first-child { border-top: 0; padding-top: 0; }
    .org-side { min-width: 0; font-family: var(--sans); }
    .org-side h3 { font-size: 22px; font-weight: 750; line-height: 1.25; letter-spacing: -0.02em; overflow-wrap: anywhere; }
    .org-side p { margin-top: 6px; font-size: 14.5px; line-height: 1.4; color: var(--faint); }
    .org-roles { display: grid; gap: 28px; }
    .org.multi .org-roles { padding-left: 22px; border-left: 2px solid var(--line); }
    .org.lead.multi .org-roles { border-left-color: var(--lead-mid); }
    .role-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 20px; font-family: var(--sans); }
    .role-head h4 { margin: 0; font-size: 20px; font-weight: 650; line-height: 1.3; letter-spacing: -0.015em; }
    .role-head .when { font-size: 14.5px; color: var(--faint); white-space: nowrap; }
    .role-body { margin-top: 10px; max-width: 70ch; color: var(--muted); }
    .role-body .bullets { margin-top: 0; }
    .role-body p + .bullets { margin-top: 10px; }

    /* ---------- Research ---------- */
    .papers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
    .paper { display: flex; flex-direction: column; padding: 24px 26px 26px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 4px; }
    .paper .state { display: flex; align-items: center; gap: 8px; font: 600 14px/1.4 var(--sans); color: var(--accent); }
    .paper .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .paper .state.done { color: var(--ok); }
    .paper h3 { margin-top: 12px; font-size: 21px; font-weight: 700; line-height: 1.3; letter-spacing: -0.015em; }
    .meta { display: flex; flex-wrap: wrap; gap: 2px 16px; margin-top: 8px; font-family: var(--sans); font-size: 14.5px; color: var(--faint); }
    .meta .kind { color: var(--muted); font-weight: 600; }
    .credit { margin-top: 12px; font-family: var(--sans); font-size: 15px; color: var(--muted); }
    .credit > span { display: block; }
    .paper .sum { margin-top: 12px; color: var(--muted); }
    .paper .btn { align-self: flex-start; margin-top: 20px; }
    .plink { display: inline-block; margin-left: 5px; padding: 0 7px; font: 600 12px/1.6 var(--sans); vertical-align: 1px; text-decoration: none; color: var(--accent); background: var(--accent-soft); border-radius: 4px; }
    .plink:hover { background: var(--accent); color: var(--accent-ink); }

    /* Expandable rows (research, writing, projects) */
    .rows { border-top: 1px solid var(--line-strong); }
    .row { border-bottom: 1px solid var(--line); }
    .row summary { display: grid; grid-template-columns: minmax(0, 1fr) auto 20px; align-items: baseline; gap: 4px 24px; padding: 16px 4px; list-style: none; cursor: pointer; }
    .row summary::-webkit-details-marker { display: none; }
    .row summary::after { content: ""; grid-column: 3; grid-row: 1; justify-self: center; width: 8px; height: 8px; margin-bottom: 3px; border-right: 2px solid var(--faint); border-bottom: 2px solid var(--faint); transform: rotate(45deg); transition: transform .2s; }
    .row[open] summary::after { transform: rotate(-135deg); margin-bottom: -3px; }
    .row-title { font-family: var(--sans); font-size: 18px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; }
    .row summary:hover .row-title { color: var(--accent); }
    .row-sub { grid-column: 1; font-family: var(--sans); font-size: 14.5px; color: var(--faint); }
    .row-when { grid-column: 2; grid-row: 1; font-family: var(--sans); font-size: 14.5px; color: var(--faint); white-space: nowrap; }
    .row-body { max-width: 72ch; padding: 0 4px 22px; color: var(--muted); }
    .row-body .credit { margin: 0 0 10px; }
    .row-body .bullets + .tags, .row-body p + .tags { margin-top: 14px; }
    .note { font-family: var(--sans); font-size: 14.5px; font-style: normal; color: var(--faint); }
    @media (prefers-reduced-motion: reduce) { .row summary::after { transition: none; } }

    /* ---------- Projects ---------- */
    .featured { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 28px 40px; }
    .feat { display: flex; flex-direction: column; padding-top: 18px; border-top: 3px solid var(--ink); }
    .feat.wip { border-top-style: dashed; border-top-color: var(--faint); }
    .feat-media { margin-bottom: 18px; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
    .feat-media img { width: 100%; height: 100%; object-fit: cover; }
    .feat .cat { font-family: var(--sans); font-size: 14.5px; font-weight: 600; color: var(--accent); }
    .feat h3 { margin-top: 6px; font-family: var(--sans); font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em; }
    .feat .when { margin-top: 6px; font-family: var(--sans); font-size: 14.5px; color: var(--faint); }
    .feat .sum, .feat .bullets { margin-top: 14px; color: var(--muted); }
    .feat .links { margin-top: auto; padding-top: 18px; }

    /* ---------- Skills ---------- */
    /* Same design as index.html */
    .skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
    .skills h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
    .skills li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 16px; }

    /* ---------- Contact ---------- */
    .contact { margin-top: clamp(72px, 10vw, 128px); padding: clamp(48px, 7vw, 88px) clamp(24px, 5vw, 64px); background: var(--accent-soft); border-radius: 8px; }
    .contact h2 { font: 800 clamp(38px, 6.5vw, 80px)/1 var(--sans); letter-spacing: -0.04em; }
    .contact p { margin-top: 18px; max-width: 52ch; font-size: 18px; color: var(--muted); }
    .contact .mail { display: inline-block; margin-top: 26px; font: 700 clamp(20px, 3vw, 30px)/1.2 var(--sans); letter-spacing: -0.02em; color: var(--accent); text-underline-offset: 8px; text-decoration-thickness: 2px; word-break: break-all; }
    .contact .mail:hover { color: var(--ink); }
    .contact .actions { margin-top: 30px; }
    .contact .btn:not(.primary) { background: var(--surface); }

    footer { padding: 32px 0 44px; font-family: var(--sans); font-size: 14px; color: var(--faint); }
    footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
    .loading { min-height: 70vh; }

    /* ---------- Responsive ---------- */
    @media (max-width: 960px) {
      .timeline { --label: 180px; }
      .org { grid-template-columns: 1fr; }
      .org.multi .org-roles { margin-top: 8px; }
    }
    @media (max-width: 860px) {
      .nav-links { display: none; }
      .hero { grid-template-columns: 1fr; }
      .subject { order: -1; width: min(100%, 34vh, 300px); }
      .creds { grid-template-columns: 1fr; }
      .creds li > a, .creds li > div { padding: 14px 0 16px; border-left: 0; }
      .creds li + li { border-top: 1px solid var(--line); }
      .skills { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      body { font-size: 16px; }
      /* Phone: photo sits beside the name so the whole hero fits on one screen */
      .hero { grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; row-gap: 0; align-items: end; }
      .hero-text { display: contents; }
      .hero h1 { grid-column: 1; grid-row: 1; padding-left: 16px; font-size: clamp(40px, 12vw, 56px); }
      .hero h1::before { width: 2.5px; }
      .hero-text > :not(h1) { grid-column: 1 / -1; }
      .subject { order: 0; grid-column: 2; grid-row: 1; width: clamp(112px, 34vw, 150px); }
      .det b { font-size: 10px; padding: 0 4px; }
      .det.screen { display: none; }
      .summary { font-size: 16px; }
      .social { margin-left: 6px; }
      .skills { grid-template-columns: 1fr; }
      .timeline { --label: 0px; }
      .tl-axis { grid-template-columns: 1fr; }
      .tl-axis > div:first-child { display: none; }
      .tl-ticks span:not(.year) { display: none; }
      .tl-row { grid-template-columns: 1fr; padding: 8px 0 10px; }
      .tl-label { position: relative; z-index: 2; padding: 0 0 6px; }
      .tl-label strong, .tl-label span { white-space: normal; }
      .row summary { grid-template-columns: minmax(0, 1fr) 20px; }
      .row summary::after { grid-column: 2; }
      .row-when { grid-column: 1; grid-row: auto; }
      .paper { padding: 20px 18px 22px; }
      .paper h3 { font-size: 20px; }
      .nav .btn { padding: 6px 12px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip To Content</a>

  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="#top" id="brand">Melvin Tai</a>
      <nav class="nav-links" aria-label="Sections">
        <a href="#timeline">Timeline</a>
        <a href="#experience">Experience</a>
        <a href="#leadership">Leadership</a>
        <a href="#writing">Research</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
      </nav>
      <a class="btn small" id="nav-resume" href="#contact">Resume</a>
    </div>
  </header>

  <main id="main" class="wrap loading" aria-busy="true"></main>

  <noscript>
    <div class="wrap" style="padding:48px 0">
      <h1>Melvin Tai</h1>
      <p>Computer Science (Data Science) undergraduate at Monash University Malaysia.
        This page needs JavaScript. You can also find me on
        <a href="https://www.linkedin.com/in/melvin-tai/">LinkedIn</a> and
        <a href="https://github.com/melvin-tai">GitHub</a>.</p>
    </div>
  </noscript>

  <footer>
    <div class="wrap">
      <span id="copyright"></span>
      <span id="sync-note"></span>
    </div>
  </footer>

  <script src="content.js"></script>
  <script>
  (function () {
    "use strict";
    const MOTION = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (MOTION) document.documentElement.classList.add("anim");

    /* ---------- Helpers (shared logic with index.html) ---------- */
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const safeUrl = (u) => {
      u = String(u ?? "").trim();
      if (!u) return "";
      if (/^(https?:|mailto:)/i.test(u)) return u;
      if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return "";
      return u;
    };
    const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
    const NOW = new Date();
    const isPresent = (s) => /^(present|now|current|ongoing)$/i.test(String(s || "").trim());
    function parseMonth(s) {
      s = String(s || "").trim();
      if (!s) return null;
      if (isPresent(s)) return new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
      const m = s.match(/^([a-z]{3})[a-z.]*\s+(\d{4})$/i);
      if (m) { const i = MONTHS.indexOf(m[1].toLowerCase()); if (i >= 0) return new Date(+m[2], i, 1); }
      const iso = s.match(/^(\d{4})-(\d{1,2})/);
      if (iso) return new Date(+iso[1], +iso[2] - 1, 1);
      return null;
    }
    const fmtMonth = (d) => d.toLocaleString("en-GB", { month: "short" }) + " " + d.getFullYear();
    function range(item) {
      if (!item.start && !item.end) return "";
      const a = item.start ? esc(item.start) : "";
      const b = item.end ? esc(isPresent(item.end) ? "Present" : item.end) : "";
      return a && b ? `${a} – ${b}` : a || b;
    }
    const list = (v) => Array.isArray(v) ? v.filter(Boolean) : String(v || "").split(",").map((s) => s.trim()).filter(Boolean);
    const lines = (v) => Array.isArray(v) ? v.filter(Boolean) : String(v || "").split(/\r?\n/).map((s) => s.replace(/^[-•*]\s*/, "").trim()).filter(Boolean);
    const resumeUrl = (p) => safeUrl(p.resume || p.resumeView || p.resumeDownload);
    const isTrue = (v) => v === true || /^(y|yes|true|1)$/i.test(String(v || "").trim());
    const endsLater = (x) => { const e = parseMonth(x.end); return !!e && !isPresent(x.end) && new Date(e.getFullYear(), e.getMonth() + 1, 1) > NOW; };
    const isResearch = (x) => isTrue(x.research);
    const isOngoing = (x) => isPresent(x.end) || endsLater(x) || /ongoing|in progress|underway|drafting/i.test(x.status || "");
    const isUpcoming = (x) => { const d = parseMonth(x.start); return !!d && !isPresent(x.start) && d > NOW; };
    const cleanLabel = (v) => esc(String(v || "").trim().replace(/[\s,;·•-]+$/, ""));
    const ext = (href) => /^https?:/i.test(href) ? ' target="_blank" rel="noopener"' : "";
    const tagList = (tags) => { const t = list(tags); return t.length ? `<ul class="tags">${t.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""; };
    const bullets = (items) => items.length ? `<ul class="bullets">${items.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : "";

    /* ---------- Optional Google Sheet override ---------- */
    function parseCSV(text) {
      const rows = []; let row = [], field = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
          else field += c;
        } else if (c === '"') q = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(field); rows.push(row); row = []; field = "";
        } else field += c;
      }
      if (field !== "" || row.length) { row.push(field); rows.push(row); }
      return rows.filter((r) => r.some((x) => x.trim() !== ""));
    }
    const camel = (k) => String(k).trim().replace(/[\s_-]+([a-z0-9])/gi, (_, c) => c.toUpperCase()).replace(/^./, (c) => c.toLowerCase());
    const SECTIONS = ["experience", "leadership", "projects", "writing", "skills"];

    function mergeSheet(base, csvText) {
      const rows = parseCSV(csvText);
      if (rows.length < 2) throw new Error("Sheet is empty");
      const head = rows[0].map((h) => camel(h));
      if (!head.includes("section")) throw new Error("Sheet has no 'section' column");
      const data = JSON.parse(JSON.stringify(base));
      const fresh = {};
      for (const r of rows.slice(1)) {
        const o = {}; head.forEach((h, i) => (o[h] = (r[i] ?? "").trim()));
        const sec = camel(o.section || "");
        if (sec === "profile") { if (o.title) data.profile[camel(o.title)] = o.summary; continue; }
        if (!SECTIONS.includes(sec)) continue;
        (fresh[sec] = fresh[sec] || []).push({
          title: o.title, organization: o.organization, location: o.location,
          start: o.start, end: o.end, status: o.status, summary: o.summary,
          highlights: lines(o.highlights), tags: list(o.tags),
          link: o.link, linkLabel: o.linkLabel, image: o.image,
          category: o.category, demo: o.demo, demoLabel: o.demoLabel,
          coauthors: o.coauthors, supervisor: o.supervisor, featured: o.featured, research: o.research
        });
      }
      for (const s of Object.keys(fresh)) data[s] = fresh[s];
      return data;
    }

    async function loadData() {
      const base = window.PORTFOLIO;
      const url = (window.PORTFOLIO_SHEET_CSV_URL || "").trim();
      if (!url) return { data: base, source: "file" };
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4000);
      try {
        const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return { data: mergeSheet(base, await res.text()), source: "sheet" };
      } catch (err) {
        console.warn("[portfolio] Google Sheet not loaded, using content.js instead:", err.message);
        return { data: base, source: "fallback" };
      } finally { clearTimeout(timer); }
    }

    /* ---------- Sections ---------- */
    const head = (title, sub = "") => `<div class="sec-head"><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}</div>`;

    function hero(p) {
      const name = String(p.name || "").trim();
      const initials = esc(name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2));
      const photo = safeUrl(p.photo);
      const school = [p.university, p.graduation ? `Graduating ${p.graduation}` : ""].filter(Boolean).map(esc).join(", ");
      const email = p.email ? `mailto:${esc(p.email)}?subject=${encodeURIComponent("Sending from your portfolio")}` : "";
      return `
      <section class="hero" id="top">
        <div class="hero-text">
          <h1>${name.split(/\s+/).map((w) => `<span>${esc(w)}</span>`).join("")}</h1>
          ${p.headline ? `<p class="role">${esc(p.headline)}</p>` : ""}
          ${school ? `<p class="school">${school}</p>` : ""}
          ${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ""}
          ${p.availability ? `<p class="status">${esc(p.availability)}</p>` : ""}
          <div class="actions">
            ${email ? `<a class="btn primary" href="${email}">Email Me</a>` : ""}
            ${resumeUrl(p) ? `<a class="btn" href="${esc(resumeUrl(p))}"${ext(resumeUrl(p))}>View Resume</a>` : ""}
            <ul class="social">
              ${p.linkedin ? `<li><a href="${esc(safeUrl(p.linkedin))}" target="_blank" rel="noopener">LinkedIn</a></li>` : ""}
              ${p.github ? `<li><a href="${esc(safeUrl(p.github))}" target="_blank" rel="noopener">GitHub</a></li>` : ""}
            </ul>
          </div>
        </div>
        <figure class="subject">
          <div class="frame">
            <span class="initials" aria-hidden="true">${initials}</span>
            ${photo ? `<img src="${esc(photo)}" alt="${esc(name)} presenting at a screen" onerror="this.closest('.subject').classList.add('no-photo');this.remove()" />
            <span class="det person" aria-hidden="true"><b>Person 0.97</b></span>
            <span class="det screen" aria-hidden="true"><b>TV 0.91</b></span>
            <span class="scan" aria-hidden="true"></span>` : ""}
          </div>
        </figure>
      </section>`;
    }

    function credentials(data) {
      const items = (data.profile || {}).highlights;
      if (!Array.isArray(items) || !items.length) return "";
      const dateLabel = (x) => {
        const s = parseMonth(x.start), e = parseMonth(x.end);
        if (s && !isPresent(x.start) && s > NOW) return "Incoming";
        if (e && !isPresent(x.end) && new Date(e.getFullYear(), e.getMonth() + 1, 1) <= NOW) return "Previously";
        return s ? "Current" : "";
      };
      const find = (arr, q) => {
        const k = String(q).toLowerCase();
        return (arr || []).find((x) => String(x.organization || "").toLowerCase().includes(k) || String(x.title || "").toLowerCase().includes(k));
      };
      const resolve = (h) => {
        if (h.experience || h.leadership) {
          const sec = h.experience ? "experience" : "leadership";
          const x = find(data[sec], h[sec]);
          if (!x) return null;
          return { label: h.label || (sec === "experience" ? dateLabel(x) : "Leadership"), title: x.organization, detail: h.detail || x.title, link: h.link || `#${sec}` };
        }
        if (h.research) {
          const papers = (data.writing || []).filter(isResearch);
          if (!papers.length) return null;
          const n = papers.length, open = papers.filter(isOngoing).length;
          const word = n === 1 ? "Paper" : "Papers";
          return { label: h.label || "Research", title: open === n ? `${n} ${word} In Progress` : `${n} Research ${word}`, detail: h.detail, link: h.link || "#writing" };
        }
        return { label: h.label || dateLabel(h), title: h.title, detail: h.detail, link: h.link };
      };
      const shown = items.map(resolve).filter((h) => h && h.title);
      if (!shown.length) return "";
      return `<ul class="creds" aria-label="Highlights" style="--n:${shown.length}">${shown.map((h) => {
        const href = safeUrl(h.link);
        const inner = `${h.label ? `<span class="k">${esc(h.label)}</span>` : ""}<strong>${esc(h.title)}</strong>${h.detail ? `<span class="d">${esc(h.detail)}</span>` : ""}`;
        return `<li>${href ? `<a href="${esc(href)}"${ext(href)}>${inner}</a>` : `<div>${inner}</div>`}</li>`;
      }).join("")}</ul>`;
    }

    function timeline(data) {
      const items = [
        ...(data.experience || []).map((x) => ({ ...x, kind: "work" })),
        ...(data.leadership || []).map((x) => ({ ...x, kind: "lead" }))
      ].map((x) => ({ ...x, s: parseMonth(x.start), e: parseMonth(x.end) }))
       .filter((x) => x.s && x.e && x.e >= x.s);
      if (!items.length) return "";
      items.forEach((x) => { if (!isPresent(x.end)) x.e = new Date(x.e.getFullYear(), x.e.getMonth() + 1, 1); });
      items.sort((a, b) => a.s - b.s || a.e - b.e);

      const grad = parseMonth((data.profile || {}).graduation);
      let min = new Date(Math.min(...items.map((x) => x.s)));
      const maxT = Math.max(...items.map((x) => x.e), NOW.getTime(), grad ? grad.getTime() : 0);
      min = new Date(min.getFullYear(), min.getMonth() - 1, 1);
      const maxD = new Date(maxT); const max = new Date(maxD.getFullYear(), maxD.getMonth() + 2, 1);
      const span = max - min;
      const pct = (d) => ((d - min) / span) * 100;

      const ticks = [];
      for (let d = new Date(min.getFullYear(), min.getMonth() + 1, 1); d < max; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
        if (d.getMonth() % 3 === 0) ticks.push(d);
      }
      const tickHtml = ticks.map((d) => d.getMonth() === 0
        ? `<span class="year num" style="left:${pct(d)}%">${d.getFullYear()}</span>`
        : `<span class="num" style="left:${pct(d)}%">${d.toLocaleString("en-GB", { month: "short" })}</span>`).join("");
      const grid = ticks.map((d) => `<i style="left:${pct(d)}%"></i>`).join("");

      const rows = items.map((x, i) => {
        const left = pct(x.s), width = Math.max(pct(x.e) - left, 0.8);
        const ongoing = isPresent(x.end), future = x.s > NOW;
        const tip = `${x.title}, ${x.organization}, ${x.start} to ${ongoing ? "present" : x.end}`;
        return `<div class="tl-row">
          <div class="tl-label" title="${esc(x.organization + " – " + x.title)}"><strong>${esc(x.organization)}</strong><span>${esc(x.title)}</span></div>
          <div class="tl-track"><div class="tl-bar ${x.kind}${ongoing ? " ongoing" : ""}${future ? " future" : ""}" style="left:${left}%;width:${width}%;--i:${i}" title="${esc(tip)}" role="img" aria-label="${esc(tip)}"></div></div>
        </div>`;
      }).join("");

      const marks = `<div class="tl-mark num" style="left:${pct(NOW)}%"><b>Today</b></div>`
        + (grad ? `<div class="tl-mark grad" style="left:${pct(grad)}%"><b>Graduation</b></div>` : "");
      const last = new Date(max.getFullYear(), max.getMonth() - 1, 1);

      return `
      <section class="sec" id="timeline">
        ${head("Timeline", `<span class="num">${esc(fmtMonth(min))} – ${esc(fmtMonth(last))}</span>`)}
        <div class="timeline">
          <div class="tl-axis"><div></div><div class="tl-ticks">${tickHtml}</div></div>
          <div class="tl-body">
            <div class="tl-grid">${grid}${marks}</div>
            ${rows}
          </div>
          <div class="tl-legend">
            <span><i></i>Professional</span>
            <span><i class="lead"></i>Leadership &amp; Service</span>
            ${items.some((x) => x.s > NOW) ? `<span><i class="future"></i>Upcoming</span>` : ""}
            ${grad ? `<span><i class="grad"></i>Expected Graduation</span>` : ""}
          </div>
        </div>
      </section>`;
    }

    function roles(id, title, sub, items, kind) {
      if (!items || !items.length) return "";
      const groups = [];
      items.forEach((x) => {
        const g = groups[groups.length - 1];
        if (g && x.organization && g[0].organization === x.organization) g.push(x); else groups.push([x]);
      });
      const role = (x) => {
        const hl = lines(x.highlights);
        return `<article>
          <div class="role-head">
            <h4>${esc(x.title)}${isUpcoming(x) ? `<span class="flag${kind === "lead" ? " lead" : ""}">Upcoming</span>` : ""}</h4>
            <span class="when num">${range(x)}</span>
          </div>
          ${x.summary || hl.length ? `<div class="role-body">${x.summary ? `<p>${esc(x.summary)}</p>` : ""}${bullets(hl)}</div>` : ""}
          ${tagList(x.tags)}
        </article>`;
      };
      const body = groups.map((g) => `
        <div class="org ${kind}${g.length > 1 ? " multi" : ""}">
          <div class="org-side"><h3>${esc(g[0].organization)}</h3>${g[0].location ? `<p>${esc(g[0].location)}</p>` : ""}</div>
          <div class="org-roles">${g.map(role).join("")}</div>
        </div>`).join("");
      return `<section class="sec" id="${id}">${head(title, sub)}<div class="roles">${body}</div></section>`;
    }

    function writing(items) {
      if (!items || !items.length) return "";
      const isFeatured = (x) => isTrue(x.featured);
      const person = (v) => {
        if (v && typeof v === "object") return { name: String(v.name || "").trim(), linkedin: v.linkedin, scholar: v.scholar, other: v.website };
        const [name, ...urls] = String(v || "").split("|").map((s) => s.trim());
        const p = { name };
        urls.forEach((u) => { if (/linkedin\.com/i.test(u)) p.linkedin = u; else if (/scholar\.google/i.test(u)) p.scholar = u; else if (u) p.other = u; });
        return p;
      };
      const people = (v) => {
        if (Array.isArray(v)) return v.map(person).filter((p) => p.name);
        const s = String(v || "").trim();
        return s ? s.split(/[;|]/.test(s) ? ";" : ",").map(person).filter((p) => p.name) : [];
      };
      const personHtml = (p) => esc(p.name) + [["LinkedIn", p.linkedin], ["Google Scholar", p.scholar], ["Profile", p.other]]
        .filter(([, u]) => /^https?:\/\//i.test(String(u || "").trim()))
        .map(([label, u]) => `<a class="plink" href="${esc(String(u).trim())}" target="_blank" rel="noopener" aria-label="${esc(p.name)} on ${label}">${label === "Google Scholar" ? "Scholar" : label}</a>`)
        .join("");
      const credits = (x) => {
        const names = people(x.coauthors).map(personHtml);
        const withText = names.length > 1 ? `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}` : names[0] || "";
        const sup = person(x.supervisor);
        return [withText ? `<span>With ${withText}</span>` : "", sup.name ? `<span>Supervised by ${personHtml(sup)}</span>` : ""].join("");
      };
      const metaLine = (x) => {
        const dates = range(x) + (endsLater(x) ? " (Expected)" : "");
        const kind = cleanLabel(x.status);
        return kind || dates ? `<p class="meta">${kind ? `<span class="kind">${kind}</span>` : ""}${dates ? `<span class="num">${dates}</span>` : ""}</p>` : "";
      };
      const paper = (x) => {
        const link = safeUrl(x.link), ongoing = isOngoing(x), credit = credits(x);
        const state = ongoing ? `<p class="state">In Progress</p>` : link ? "" : `<p class="state done">Completed</p>`;
        return `<article class="paper">
          ${state}
          <h3>${esc(x.title)}</h3>
          ${metaLine(x)}
          ${credit ? `<p class="credit">${credit}</p>` : ""}
          ${x.summary ? `<p class="sum">${esc(x.summary)}</p>` : ""}
          ${link ? `<a class="btn small primary" href="${esc(link)}"${ext(link)}>${esc(x.linkLabel || "Read Paper")}</a>` : ""}
        </article>`;
      };
      const row = (x) => {
        const ongoing = isOngoing(x);
        const link = ongoing ? "" : safeUrl(x.link);
        const when = isResearch(x) ? range(x) + (endsLater(x) ? " (Expected)" : "") : ongoing && x.start ? `Since ${esc(x.start)}` : "";
        const credit = credits(x);
        return `<details class="row">
          <summary>
            <span class="row-title">${esc(x.title)}${ongoing ? `<span class="flag">In Progress</span>` : ""}</span>
            ${when ? `<span class="row-when num">${when}</span>` : ""}
            ${x.status ? `<span class="row-sub">${cleanLabel(x.status)}</span>` : ""}
          </summary>
          <div class="row-body">
            ${credit ? `<p class="credit">${credit}</p>` : ""}
            ${x.summary ? `<p>${esc(x.summary)}</p>` : ""}
            <div class="links">${link
              ? `<a class="text-link" href="${esc(link)}"${ext(link)}>${esc(x.linkLabel || (isResearch(x) ? "Read Paper" : "Read"))}</a>`
              : `<em class="note">${ongoing ? "In Progress" : "Available On Request"}</em>`}</div>
          </div>
        </details>`;
      };
      const featured = items.filter(isFeatured);
      const research = items.filter((x) => isResearch(x) && !isFeatured(x));
      const cards = research.filter(isOngoing);
      const finished = research.filter((x) => !isOngoing(x));
      const rest = items.filter((x) => !isResearch(x) && !isFeatured(x));
      const others = [...rest.filter((x) => !isOngoing(x)), ...rest.filter(isOngoing)];
      const body =
        (featured.length ? `<p class="group-label">Featured</p><div class="papers">${featured.map(paper).join("")}</div>` : "") +
        (research.length ? `<p class="group-label">Research Papers</p>` +
          (cards.length ? `<div class="papers">${cards.map(paper).join("")}</div>` : "") +
          (finished.length ? `<div class="rows"${cards.length ? ' style="margin-top:20px"' : ""}>${finished.map(row).join("")}</div>` : "") : "") +
        (others.length ? `<p class="group-label">Preprints &amp; Proposals</p><div class="rows">${others.map(row).join("")}</div>` : "");
      return `<section class="sec" id="writing">${head("Research &amp; Writing", "Papers, Preprints &amp; Academic Proposals")}${body}</section>`;
    }

    function projects(items, p) {
      if (!items || !items.length) return "";
      const isDone = (x) => x.status ? /complete|done|shipped|live/i.test(x.status) : !isPresent(x.end);
      const linkRow = (x) => {
        const link = safeUrl(x.link), demo = safeUrl(x.demo);
        return link || demo ? `<div class="links">
          ${demo ? `<a class="text-link" href="${esc(demo)}"${ext(demo)}>${esc(x.demoLabel || "Live Demo")}</a>` : ""}
          ${link ? `<a class="text-link" href="${esc(link)}"${ext(link)}>${esc(x.linkLabel || "Repository")}</a>` : ""}
        </div>` : "";
      };
      const feat = (x) => {
        const img = safeUrl(x.image), hl = lines(x.highlights), when = range(x), done = isDone(x);
        return `<article class="feat${done ? "" : " wip"}">
          ${img ? `<div class="feat-media"><img src="${esc(img)}" alt="" loading="lazy" onerror="this.parentNode.remove()" /></div>` : ""}
          ${x.category ? `<p class="cat">${esc(x.category)}</p>` : ""}
          <h3>${esc(x.title)}${done ? "" : `<span class="flag">In Progress</span>`}</h3>
          ${when ? `<p class="when num">${when}</p>` : ""}
          ${x.summary ? `<p class="sum">${esc(x.summary)}</p>` : ""}
          ${bullets(hl)}
          ${tagList(x.tags)}
          ${linkRow(x)}
        </article>`;
      };
      const row = (x) => {
        const hl = lines(x.highlights), when = range(x), done = isDone(x);
        return `<details class="row">
          <summary>
            <span class="row-title">${esc(x.title)}${done ? "" : `<span class="flag">In Progress</span>`}</span>
            ${when ? `<span class="row-when num">${when}</span>` : ""}
            ${x.category ? `<span class="row-sub">${esc(x.category)}</span>` : ""}
          </summary>
          <div class="row-body">
            ${x.summary ? `<p>${esc(x.summary)}</p>` : ""}
            ${bullets(hl)}
            ${tagList(x.tags)}
            ${linkRow(x)}
          </div>
        </details>`;
      };
      const done = items.filter(isDone), wip = items.filter((x) => !isDone(x));
      const featured = items.filter((x) => isTrue(x.featured));
      const rest = [...wip, ...done].filter((x) => !isTrue(x.featured));
      let body;
      if (featured.length) {
        body = `<div class="featured">${featured.map(feat).join("")}</div>` +
          (rest.length ? `<p class="group-label">More Projects</p><div class="rows">${rest.map(row).join("")}</div>` : "");
      } else if (wip.length && done.length) {
        body = `<p class="group-label">Currently Building</p><div class="featured">${wip.map(feat).join("")}</div>` +
          `<p class="group-label">Completed</p><div class="rows">${done.map(row).join("")}</div>`;
      } else {
        body = `<div class="featured">${items.map(feat).join("")}</div>`;
      }
      const gh = safeUrl(p.github);
      const sub = `${done.length} Completed, ${wip.length} In Progress${gh ? `. <a href="${esc(gh)}" target="_blank" rel="noopener">View All On GitHub</a>` : ""}`;
      return `<section class="sec" id="projects">${head("Projects", sub)}${body}</section>`;
    }

    function skills(groups) {
      if (!groups || !groups.length) return "";
      const cols = groups.map((g) => `<div><h3>${esc(g.title)}</h3><ul>${list(g.tags).map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>`).join("");
      return `<section class="sec" id="skills">${head("Skills")}<div class="skills">${cols}</div></section>`;
    }

    function contact(p) {
      const r = resumeUrl(p);
      return `<section class="contact" id="contact">
        <h2>Let's Work Together.</h2>
        <p>${p.availability ? `${esc(p.availability)}. ` : ""}The quickest way to reach me is by email.</p>
        ${p.email ? `<a class="mail" href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ""}
        <div class="actions">
          ${r ? `<a class="btn primary" href="${esc(r)}"${ext(r)}>View Resume</a>` : ""}
          ${p.linkedin ? `<a class="btn" href="${esc(safeUrl(p.linkedin))}" target="_blank" rel="noopener">LinkedIn</a>` : ""}
          ${p.github ? `<a class="btn" href="${esc(safeUrl(p.github))}" target="_blank" rel="noopener">GitHub</a>` : ""}
        </div>
      </section>`;
    }

    /* ---------- Render ---------- */
    function render(data, source) {
      const p = data.profile || {};
      const main = document.getElementById("main");
      main.innerHTML =
        hero(p) +
        credentials(data) +
        timeline(data) +
        roles("experience", "Experience", "", data.experience, "work") +
        roles("leadership", "Leadership &amp; Service", "Student Organisations &amp; Teams", data.leadership, "lead") +
        writing(data.writing) +
        projects(data.projects, p) +
        skills(data.skills) +
        contact(p);
      motion(main);
      main.classList.remove("loading");
      main.removeAttribute("aria-busy");

      document.getElementById("brand").textContent = p.name || "Portfolio";
      const resumeHref = resumeUrl(p) || "#contact";
      const nr = document.getElementById("nav-resume");
      nr.href = resumeHref;
      if (/^https?:/i.test(resumeHref)) { nr.target = "_blank"; nr.rel = "noopener"; }
      document.getElementById("copyright").textContent = `© ${NOW.getFullYear()} ${p.name || ""}`;
      if (source === "sheet") document.getElementById("sync-note").textContent = "Content synced from Google Sheets";

      document.querySelectorAll(".nav-links a").forEach((a) => { if (!document.querySelector(a.getAttribute("href"))) a.remove(); });
      watchSections();
      if (location.hash) {
        const t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (t) t.scrollIntoView();
      }
    }

    function watchSections() {
      const links = [...document.querySelectorAll(".nav-links a")];
      const map = new Map(links.map((a) => [a.getAttribute("href").slice(1), a]));
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { links.forEach((l) => l.classList.remove("is-active")); map.get(e.target.id)?.classList.add("is-active"); }
        });
      }, { rootMargin: "-45% 0px -50% 0px" });
      map.forEach((_, id) => { const el = document.getElementById(id); if (el) io.observe(el); });
    }

    /* ---------- Draft animations (styles live in the "Draft animations" CSS block) ---------- */
    function motion(root) {
      if (!MOTION) return;

      // Portrait: run the detector once on load, again whenever the photo is hovered or tapped
      const subject = root.querySelector(".subject");
      if (subject && subject.querySelector(".det")) {
        subject.querySelectorAll(".det b").forEach((b) => {
          const m = b.textContent.match(/^(.*\s)(\d\.\d+)$/);
          if (m) b.addEventListener("animationstart", () => countUp(b, m[1], parseFloat(m[2])));
        });
        let busy = false;
        const run = () => {
          if (busy) return;
          busy = true;
          subject.classList.remove("run");
          void subject.offsetWidth; // restart the CSS animations
          subject.classList.add("run");
          setTimeout(() => { busy = false; }, 1800);
        };
        run();
        subject.addEventListener("pointerenter", run);
      }

      // Timeline: draw the bars the first time the chart scrolls into view
      const tl = root.querySelector(".timeline");
      if (tl) {
        const io = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { tl.classList.add("in"); io.disconnect(); }
        }, { rootMargin: "0px 0px -15% 0px" });
        io.observe(tl);
      }
    }

    // Confidence score climbs from 0.00 to its final value, like a detector settling
    function countUp(el, label, score) {
      const dur = 700, final = label + score.toFixed(2);
      let t0 = null;
      const step = (t) => {
        if (t0 === null) t0 = t;
        const k = Math.max(0, Math.min((t - t0) / dur, 1));
        el.textContent = label + (score * (1 - Math.pow(1 - k, 3))).toFixed(2);
        if (k < 1) requestAnimationFrame(step);
      };
      el.textContent = label + "0.00";
      requestAnimationFrame(step);
      setTimeout(() => { el.textContent = final; }, dur + 150); // lands on the real value even if frames are throttled
    }

    const nav = document.getElementById("nav");
    addEventListener("scroll", () => nav.classList.toggle("is-stuck", scrollY > 8), { passive: true });

    if (!window.PORTFOLIO) {
      document.getElementById("main").innerHTML = '<p style="padding:64px 0">content.js didn\'t load. Keep it in the same folder as home.html.</p>';
      return;
    }
    loadData().then(({ data, source }) => render(data, source));
  })();
  </script>
